name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is what production runs; 22 guards against upgrade surprises.
        # Node 18 is excluded deliberately: it is end-of-life, and the test suite
        # relies on mock.timers Date faking, which needs Node >= 20.4.
        node-version: ['20.x', '22.x']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
